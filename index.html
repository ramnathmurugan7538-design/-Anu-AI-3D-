<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#130b2a"><title>Anu AI – Clear 3D Mesh Viewer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10091f;color:#fff;font:15px system-ui,'Noto Sans Tamil',sans-serif}header{text-align:center;padding:14px 10px 8px}h1{font-size:20px;margin:0 0 4px}p{color:#d8c9ef;font-size:13px;margin:0}main{max-width:760px;margin:auto;padding:10px}.stage{height:72vh;min-height:420px;position:relative;border:1px solid #68489a;border-radius:15px;overflow:hidden;background:radial-gradient(ellipse at center,#72519b,#211638 65%,#10091f)}#viewer{position:absolute;inset:0}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button{background:#6840a5;color:white;border:1px solid #a98ad1;border-radius:10px;padding:11px 13px;font-weight:650;font-size:14px}.status{background:#211638;border:1px solid #68489a;border-radius:10px;padding:10px;color:#eadfff;font-size:13px;line-height:1.5;margin-top:10px}.hint{font-size:12px;color:#cbbde4;line-height:1.6;margin:10px 2px}.tag{position:absolute;top:9px;left:9px;background:#160d29dd;border:1px solid #ffffff55;border-radius:30px;padding:6px 10px;font-size:11px;z-index:4;pointer-events:none}button:disabled{opacity:.45}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body><header><h1>💜 Anu AI – Clear 3D Model</h1><p>Coloured GLB Mesh Viewer · Android Chrome</p></header><main>
<div class="stage"><div id="viewer"></div><span class="tag">3D MESH · Drag to rotate · Pinch to zoom</span></div>
<div class="bar"><button id="front">◎ Front View</button><button id="reset">↺ Reset View</button><button id="full">⛶ Full Screen</button></div>
<div class="status" id="status">⏳ Anu 3D மாடல் ஏற்றப்படுகிறது…</div>
<p class="hint">இந்த Viewer, பழைய PLY Gaussian Splat-க்கு பதிலாக GLB mesh-ஐப் பயன்படுத்துகிறது. முக விவரங்கள் மூல GLB கோப்பில் உள்ள அளவுக்கு மட்டுமே தெளிவாகத் தெரியும்.</p>
</main>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const host=document.getElementById('viewer'),status=document.getElementById('status');
const scene=new THREE.Scene();scene.background=null;
const camera=new THREE.PerspectiveCamera(32,1,0.01,100);camera.position.set(0,0,2.9);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x554466,2.0));
const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(2,3,4);scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,1.0);fill.position.set(-3,1,2);scene.add(fill);
const rim=new THREE.DirectionalLight(0xffffff,1.4);rim.position.set(0,2,-3);scene.add(rim);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.target.set(0,0,0);controls.minDistance=.65;controls.maxDistance=6;controls.update();
let model=null,baseCamera=new THREE.Vector3(0,0,2.9);
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);resize();
new GLTFLoader().load('./anu.glb',g=>{model=g.scene;model.traverse(o=>{if(o.isMesh){o.frustumCulled=false;if(o.material){o.material.side=THREE.DoubleSide;o.material.needsUpdate=true;}}});scene.add(model);const box=new THREE.Box3().setFromObject(model);const size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());model.position.sub(center);const height=Math.max(size.y,.1);const dist=(height*.5)/Math.tan(THREE.MathUtils.degToRad(camera.fov*.5))*1.18;baseCamera.set(0,0,dist);camera.position.copy(baseCamera);controls.target.set(0,0,0);controls.update();status.textContent='✅ Anu GLB மாடல் ஏற்றப்பட்டது. முகத்தைப் பார்க்க Zoom செய்யவும்; இழுத்து சுழற்றவும்.';},undefined,e=>{console.error(e);status.textContent='❌ GLB ஏற்ற முடியவில்லை: '+(e?.message||'Network error')+'. anu.glb கோப்பு இதே repository-ல் இருக்க வேண்டும்.'});
function front(){camera.position.copy(baseCamera);camera.up.set(0,1,0);controls.target.set(0,0,0);controls.update()}
document.getElementById('front').onclick=front;document.getElementById('reset').onclick=()=>{front();status.textContent='Front view reset செய்யப்பட்டது.'};document.getElementById('full').onclick=()=>{const el=document.querySelector('.stage');if(!document.fullscreenElement)el.requestFullscreen?.();else document.exitFullscreen?.()};
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
